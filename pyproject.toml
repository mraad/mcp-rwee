[project]
name = "mcp-rwee"
version = "0.1.0"
description = "MCP server with four tools (read, write, edit, execute) and a user-defined prompt"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1,<5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
